[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetpilot"
version = "0.1.0"
description = "Deterministic Excel agent execution harness"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1"]

[project.scripts]
sheetpilot = "sheetpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
